# === Rebranding "Commandes LPS" — logos + favicon GLPI ===
# À coller DANS le bloc <VirtualHost *:443> du vhost de commandes.lps.u-psud.fr
# (trouver le fichier : apache2ctl -S | grep -i commandes)
#
# Principe : les Alias interceptent les URLs des logos GLPI et les servent
# depuis /var/www/commandes-branding/ (hors arbre GLPI → survit aux mises à jour).
# Revert : commenter ce bloc + `systemctl reload apache2`.

    Alias /pics/logos/logo-GLPI-100-white.png  /var/www/commandes-branding/logo-GLPI-100-white.png
    Alias /pics/logos/logo-GLPI-100-black.png  /var/www/commandes-branding/logo-GLPI-100-black.png
    Alias /pics/logos/logo-GLPI-250-black.png  /var/www/commandes-branding/logo-GLPI-250-black.png
    Alias /pics/logos/logo-GLPI-250-white.png  /var/www/commandes-branding/logo-GLPI-250-white.png
    Alias /pics/logos/logo-G-100-white.png     /var/www/commandes-branding/logo-G-100-white.png
    Alias /pics/logos/logo-G-100-black.png     /var/www/commandes-branding/logo-G-100-black.png
    Alias /pics/favicon.ico                    /var/www/commandes-branding/favicon.ico

    <Directory /var/www/commandes-branding>
        Require all granted
        Options -Indexes
        # Force la revalidation pour éviter que les anciens logos restent en cache navigateur.
        # (nécessite mod_headers : a2enmod headers)
        <IfModule mod_headers.c>
            Header set Cache-Control "no-cache, must-revalidate"
        </IfModule>
    </Directory>
